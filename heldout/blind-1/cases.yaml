# Held-out set blind-1. Written from docs/EVAL_METHOD.md, heldout/WRITING_CASES.md, the package PDFs and the
# truth files only (no code was read). Findings are in the order an agent would return them, grouped by package.
# Section numbers in `why` refer to docs/EVAL_METHOD.md.

