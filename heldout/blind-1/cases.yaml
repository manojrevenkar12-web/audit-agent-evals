    type: casting
    document: jahresabschluss_2026.pdf
    page: 3
    row_label: "Summe Passiva"
    column: "31.12.2026 TEUR"
    found_value: "21.760"
    expected_value: "27.160"
    explanation: "Eigenkapital 13.671 + Rückstellungen 1.629 + Verbindlichkeiten 11.830 + RAP 31 = 27.161; Summe Aktiva is 27.160. The printed 21.760 looks like a transposition."
    confidence: 0.95
  expect:
    verdict: hit
    defect: heldout-7000.d3
  why: "§4 step 2: exact label and exact header give bs.total.liabilities:cy, the changed cell of d3; casting is acceptable; first finding for d3."

- package: heldout-7000
  finding:
    type: narrative
    document: jahresabschluss_2026.pdf
    page: 8
    quote: "Die Eigenkapitalquote beträgt zum Stichtag 50,3 %"
    expected_value: "62,8 %"
    explanation: "Equity 13.671 divided by the printed balance sheet total 21.760 gives 62,8 %, not 50,3 %."
    confidence: 0.6
  expect:
    verdict: duplicate
    defect: heldout-7000.d3
  why: "§4 step 4 with no found_value: the claim sharing at least half its words with the quote is claim.equity_ratio, an acceptable location of d3 (a symptom, §7) with narrative acceptable; d3 already found by the previous finding."

- package: heldout-7000
  finding:
    type: casting
