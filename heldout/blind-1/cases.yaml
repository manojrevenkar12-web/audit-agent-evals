    explanation: "The liabilities side does not add up to its total."
    confidence: 0.8
  expect:
    verdict: duplicate
    defect: heldout-7000.d3
  why: "No row label, so §4 step 2 does not apply; step 3 finds no heading on page 3 equal to or containing 'Summe Passiva'; step 4 finds no claim with 21.760; step 5 finds exactly one cell on page 3 showing 21.760 (bs.total.liabilities:cy). Assumes the steps fall through when one finds nothing."

